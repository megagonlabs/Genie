# Repo-wide pytest settings.
#
# These stay at the repository root because they cover `examples/` as well as
# `lib/`. The `genie` package metadata lives in `pyproject.toml`, also at the
# root.

[pytest]
# What a bare `pytest` run collects.
testpaths =
    lib/tests
    examples/lamps

# Import paths for code that is not installed as a package.
#   lib/src  the `genie` package, for a checkout where nobody ran pip install
#   lib      the `tests` and `benchmarks` packages the test suite imports
#   .        the repository root, for `examples.*`
pythonpath =
    lib/src
    lib
    .
