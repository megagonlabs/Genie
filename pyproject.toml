[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie"
version = "0.1.0"
description = "Platform-, storage-, and use-case-agnostic building blocks for memory systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Megagon Labs" }
]
keywords = ["agents", "memory", "scoped-memory", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mongodb = [
  "pymongo>=4.7",
]
neo4j = [
  "neo4j>=5.26",
]
postgres = [
  "psycopg[binary]>=3.1",
]
redis = [
  "redis>=5.0",
]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["lib/src"]
include = ["genie*"]

[tool.setuptools.package-data]
genie = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["lib/tests", "lamps"]
pythonpath = ["lib/src", "lib", "."]

[tool.black]
line-length = 193

[tool.ruff]
line-length = 193
# Roots that hold first-party code, so import sorting groups `genie`,
# `tests`, `examples`, and `lamps` correctly.
src = ["lib/src", "lib", "."]

[tool.isort]
profile = "black"
line_length = 193
src_paths = ["lib/src", "lib", "."]
