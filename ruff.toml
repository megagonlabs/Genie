# Repo-wide ruff settings.
#
# These stay at the repository root because ruff looks for its settings by
# walking up from each file. A config inside `lib/` would never reach
# `examples/`. The `genie` package metadata lives in `pyproject.toml`, also at
# the root.

line-length = 193

# First-party import roots, so import sorting groups them correctly.
src = ["lib/src", "lib", "."]

[lint]
# Genie requires timezone-aware datetimes. The default rule set of ruff changes
# between versions, so this turns on all `DTZ` rules explicitly.
extend-select = ["DTZ"]

# Python 3.12 turns on the PEP 695 rules. They stay off:
# - `UP040`: a `type` alias is a `TypeAliasType`, not the aliased type. Public
#   aliases such as `BlockRef` then fail in `isinstance()` and `get_args()`.
# - `UP046`, `UP047`: PEP 695 type parameters infer variance, and the code
#   keeps one `TypeVar` style.
ignore = ["UP040", "UP046", "UP047"]
